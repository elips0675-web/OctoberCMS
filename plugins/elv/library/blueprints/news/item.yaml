uuid: ffcc9263-f919-4cf3-8243-991793a60e9c
handle: Elv\News
type: stream
name: Новость
drafts: false

primaryNavigation:
    label: Новости
    icon: octo-icon-file
    order: 100

navigation:
    label: Все новости
    icon: octo-icon-file
    order: 100

fields:
    xml_id:
        label: 'ID в Битриксе'
        commentAbove: 'Ключ импорта. Не менять — иначе повторный импорт создаст дубль.'
        type: text
        span: left

    sort:
        label: Сортировка
        type: number
        default: 100
        span: right

    title:
        label: Заголовок
        type: text
        required: true

    slug:
        label: Адрес (slug)
        commentAbove: 'Латиница и дефисы. Адрес страницы: /news/{slug}/'
        type: text
        required: true

    published_at:
        label: Дата публикации
        type: datepicker
        mode: datetime
        span: left

    is_enabled:
        label: Опубликовано
        type: checkbox
        default: true
        span: right

    section:
        label: Раздел
        type: entries
        source: Elv\NewsSection
        maxItems: 1
        span: left

    image:
        label: Картинка
        type: mediafinder
        mode: image
        span: right

    excerpt:
        label: Анонс
        commentAbove: '1–2 предложения для карточки в списке.'
        type: textarea
        size: small

    seo_title:
        label: 'Заголовок для поиска'
        commentAbove: 'Если пусто — «Название — Библиотека 2026». До 60 символов.'
        type: text

    seo_description:
        label: 'Описание для поиска'
        commentAbove: 'Если пусто — анонс. До 160 символов.'
        type: textarea
        size: small

    content:
        label: Текст
        type: richeditor

    author:
        label: Автор
        type: text
        span: left

    read_time:
        label: Время чтения
        type: text
        span: right

    tags:
        label: Теги
        type: taglist
        options:
            books: Книги
            digital: Цифровые ресурсы
            events: События
            kids: Дети
            science: Наука
            library: Библиотека

    source_url:
        label: Ссылка на источник
        type: text
