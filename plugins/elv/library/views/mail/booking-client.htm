<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Бронь принята</h1>
<p style="font:14px/1.5 Arial, sans-serif; margin:0 0 12px">
    Здравствуйте, {{ booking.PERSON }}. Мы получили заявку и свяжемся с вами для подтверждения.
</p>
<table cellpadding="0" cellspacing="0" style="font:14px/1.5 Arial, sans-serif">
    <tr><td style="padding:2px 12px 2px 0; color:#555">Услуга</td><td>{{ booking.SERVICE }}</td></tr>
    <tr><td style="padding:2px 12px 2px 0; color:#555">Дата</td><td>{{ booking.DATE }}</td></tr>
    <tr><td style="padding:2px 12px 2px 0; color:#555">Время</td><td>{{ booking.TIME }}</td></tr>
    <tr><td style="padding:2px 12px 2px 0; color:#555">Телефон</td><td>{{ booking.PHONE }}</td></tr>
</table>
<p style="font:12px/1.5 Arial, sans-serif; margin:16px 0 0; color:#777">
    Если бронь больше не нужна — ответьте на письмо или позвоните в библиотеку.
</p>
