<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Подтвердите подписку</h1>
<p style="font:14px/1.5 Arial, sans-serif; margin:0 0 16px">
    Вы подписались на новости библиотеки ({{ email }}). Осталось подтвердить адрес — без этого письма
    не приходят.
</p>
<p style="margin:0 0 16px">
    <a href="{{ confirmUrl }}" style="display:inline-block; padding:12px 20px; background:#2563eb; color:#fff; text-decoration:none; border-radius:8px; font:600 14px/1 Arial, sans-serif">Подтвердить подписку</a>
</p>
<p style="font:12px/1.5 Arial, sans-serif; margin:0; color:#777">
    Если подписка не нужна — <a href="{{ unsubscribeUrl }}" style="color:#777">отпишитесь</a> одним нажатием.
</p>
