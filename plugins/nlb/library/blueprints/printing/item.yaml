uuid: ca04aafc-a5d3-41c8-b1e9-998c1cc4d475
handle: Nlb\Printing
type: stream
name: Услуга печати
drafts: false

primaryNavigation:
    label: Печать
    icon: octo-icon-printer
    order: 150

navigation:
    label: Все услуги печати
    icon: octo-icon-printer
    order: 100

fields:
    xml_id:
        label: 'ID в Битриксе'
        commentAbove: 'Ключ импорта. Не менять.'
        type: text
        span: left

    sort:
        label: Сортировка
        type: number
        default: 100
        span: right

    title:
        label: Название
        type: text
        required: true

    slug:
        label: Адрес (slug)
        commentAbove: 'Латиница и дефисы. Адрес страницы: /printing/{slug}/'
        type: text
        required: true

    published_at:
        label: Дата публикации
        type: datepicker
        mode: datetime
        span: left

    is_enabled:
        label: Опубликовано
        type: checkbox
        default: true
        span: right

    image:
        label: Картинка
        type: mediafinder
        mode: image
        span: left

    icon:
        label: Иконка
        commentAbove: 'Имя из спрайта: file, printer, copy и т.д.'
        type: text
        span: right

    color:
        label: Цвет
        type: dropdown
        span: left
        options:
            primary: Синий
            green: Зелёный
            sky: Голубой
            pink: Розовый
            orange: Оранжевый

    price_from:
        label: Цена от, ₽
        type: number
        span: right

    unit:
        label: Единица
        commentAbove: 'Например: «за страницу».'
        type: text

    excerpt:
        label: Анонс
        type: textarea
        size: small

    content:
        label: Описание
        type: richeditor
