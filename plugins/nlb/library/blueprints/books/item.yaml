uuid: f92fe151-9985-42b9-b2a5-e77aed59abec
handle: Nlb\Book
type: stream
name: Сувенир
drafts: false

primaryNavigation:
    label: Сувениры
    icon: octo-icon-gift
    order: 120

navigation:
    label: Все сувениры
    icon: octo-icon-gift
    order: 100

fields:
    xml_id:
        label: 'ID в Битриксе'
        commentAbove: 'Ключ импорта. Не менять.'
        type: text
        span: left

    sort:
        label: Сортировка
        type: number
        default: 100
        span: right

    title:
        label: Название
        type: text
        required: true

    slug:
        label: Адрес (slug)
        commentAbove: 'Латиница и дефисы. Адрес страницы: /books/{slug}/'
        type: text
        required: true

    published_at:
        label: Дата публикации
        type: datepicker
        mode: datetime
        span: left

    is_enabled:
        label: Опубликовано
        type: checkbox
        default: true
        span: right

    section:
        label: Раздел
        type: entries
        source: Nlb\BookSection
        maxItems: 1
        span: left

    image:
        label: Картинка
        type: mediafinder
        mode: image
        span: right

    author:
        label: Материал
        type: text
        span: left

    year:
        label: Размер
        type: text
        span: right

    isbn:
        label: Артикул
        type: text
        span: left

    publisher:
        label: Упаковка
        type: text
        span: right

    pages:
        label: Вес, г
        type: number
        span: left

    age_limit:
        label: Возраст
        type: dropdown
        span: right
        options:
            all: Всем
            kids: Детям
            adult: Взрослым

    available:
        label: Наличие
        type: dropdown
        span: left
        options:
            available: В наличии
            reserved: Под заказ
            unavailable: Нет в наличии

    shelf:
        label: Комплектация
        type: text
        span: right

    price:
        label: Цена, ₽
        type: number
        span: left

    excerpt:
        label: Анонс
        type: textarea
        size: small

    seo_title:
        label: 'Заголовок для поиска'
        commentAbove: 'Если пусто — «Название — Библиотека 2026». До 60 символов.'
        type: text

    seo_description:
        label: 'Описание для поиска'
        commentAbove: 'Если пусто — анонс. До 160 символов.'
        type: textarea
        size: small

    content:
        label: Описание
        type: richeditor
