uuid: 02a43c2a-270b-4f70-b3e6-f9eeccd87f3b
handle: Nlb\Blocks
type: mixin
name: Блоки страницы

fields:
    blocks:
        label: Блоки
        commentAbove: 'Порядок блоков на странице. Каждый блок — отдельный партиал темы.'
        type: repeater
        displayMode: builder
        span: adaptive
        prompt: 'Добавить блок'
        groups:
            text:
                name: Текст
                description: 'Подзаголовок и абзацы текста'
                icon: octo-icon-paragraph
                fields:
                    title:
                        label: Подзаголовок
                        type: text
                    body:
                        label: Текст
                        type: richeditor

            text-image:
                name: Текст с картинкой
                description: 'Абзацы рядом с изображением'
                icon: octo-icon-image
                fields:
                    title:
                        label: Подзаголовок
                        type: text
                    body:
                        label: Текст
                        type: richeditor
                    image:
                        label: Картинка
                        type: mediafinder
                        mode: image
                    image_position:
                        label: Картинка
                        type: dropdown
                        default: right
                        options:
                            left: Слева
                            right: Справа
                    caption:
                        label: Подпись к картинке
                        type: text

            quote:
                name: Цитата
                description: 'Цитата, примечание или предупреждение'
                icon: octo-icon-quote-left
                fields:
                    kind:
                        label: Вид
                        type: dropdown
                        default: quote
                        options:
                            quote: Цитата
                            note: Примечание
                            warning: Предупреждение
                    text:
                        label: Текст
                        type: textarea
                        size: small
                    author:
                        label: Автор
                        type: text

            records:
                name: Сетка записей
                description: 'Новости, события, книги и другие записи раздела'
                icon: octo-icon-th
                fields:
                    title:
                        label: Подзаголовок
                        type: text
                    source:
                        label: Раздел
                        commentAbove: 'Опубликованные записи в порядке сортировки раздела.'
                        type: dropdown
                        required: true
                        options:
                            books: Сувениры и подарки
                            collections: Подборки
                            events: События
                            news: Новости
                            printing: Печать
                            services: Услуги
                    limit:
                        label: Сколько записей
                        commentAbove: 'От 1 до 12. Один запрос к БД на блок.'
                        type: number
                        default: 3

            video:
                name: Видео
                description: 'Свой файл MP4 с обложкой'
                icon: octo-icon-video
                fields:
                    title:
                        label: Подзаголовок
                        type: text
                    file:
                        label: Файл
                        commentAbove: 'MP4 из медиатеки October. Внешние плееры не подключаются: CSP разрешает только свой домен.'
                        type: mediafinder
                        mode: file
                    poster:
                        label: Обложка
                        type: mediafinder
                        mode: image
                    caption:
                        label: Подпись
                        type: text

            toc:
                name: Оглавление
                description: 'Список подзаголовков страницы со ссылками'
                icon: octo-icon-list-ul
                fields:
                    title:
                        label: Заголовок блока
                        type: text
                        default: Содержание
                    include_h3:
                        label: 'Показывать подзаголовки третьего уровня'
                        type: checkbox
                        default: false
