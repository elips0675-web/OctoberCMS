    place:
        label: Место
        type: text

    category:
        label: Категория
        type: dropdown
        span: left
        options:
            literature: Литература
            children: Для детей
            tech: Технологии
            lecture: Лекции

    format:
        label: Формат
        type: dropdown
        span: right
        options:
            offline: Офлайн
            online: Онлайн
            hybrid: Гибрид

    seats:
        label: Мест
        type: number
        span: left

    price:
