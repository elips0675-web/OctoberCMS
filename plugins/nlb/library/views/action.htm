<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{ title }} — Библиотека 2026</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #0b1220; color: #e6edf7; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        main { max-width: 34rem; padding: 2.5rem; margin: 1.5rem; background: #131c2e; border-radius: 16px; }
        h1 { margin: 0 0 1rem; font-size: 1.6rem; }
        p { margin: 0 0 1.5rem; color: #b6c2d4; }
        a { color: #7fb2ff; }
        .btn { display: inline-block; padding: .75rem 1.25rem; background: #2563eb; color: #fff;
               border-radius: 10px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<main>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn" href="{{ url('/') }}">На главную</a>
</main>
</body>
</html>
