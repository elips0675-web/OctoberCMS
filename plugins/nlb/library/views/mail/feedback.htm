<h1 style="font:600 18px/1.4 Arial, sans-serif; margin:0 0 12px">Обращение с сайта</h1>
<table cellpadding="0" cellspacing="0" style="font:14px/1.5 Arial, sans-serif">
    <tr><td style="padding:2px 12px 2px 0; color:#555">Имя</td><td>{{ feedback.NAME ?: '—' }}</td></tr>
    <tr><td style="padding:2px 12px 2px 0; color:#555">E-mail</td><td>{{ feedback.EMAIL ?: '—' }}</td></tr>
    <tr><td style="padding:2px 12px 2px 0; color:#555">Телефон</td><td>{{ feedback.PHONE ?: '—' }}</td></tr>
    <tr><td style="padding:2px 12px 2px 0; color:#555">Тема</td><td>{{ feedback.SUBJECT ?: 'без темы' }}</td></tr>
</table>
<p style="font:14px/1.5 Arial, sans-serif; margin:16px 0 0; white-space:pre-line">{{ feedback.MESSAGE }}</p>
