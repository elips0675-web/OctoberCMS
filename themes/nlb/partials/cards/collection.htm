{% set color = nlb_collection_color(item.color) %}
<div class="col-md-6 col-lg-4">
    <div class="collection-card collection-card--{{ color }} h-100">
        <span class="icon-tile icon-tile--{{ color }}"><svg class="i" aria-hidden="true"><use href="#i-{{ item.icon ?: 'book' }}"/></svg></span>
        <h2>{{ item.title }}</h2>
        {% if item.items_count > 0 %}<div class="collection-count">Предметов: {{ item.items_count }}</div>{% endif %}
        <p class="collection-text">{{ item.excerpt }}</p>
        <a class="collection-more" href="/collections/{{ item.slug }}/">Узнать больше<svg class="i i-20" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
    </div>
</div>
