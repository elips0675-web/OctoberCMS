{% if block.data.title %}
    <h2 class="h3 mt-5 mb-3"{% if block.data.title_id %} id="{{ block.data.title_id }}"{% endif %}>{{ block.data.title }}</h2>
{% endif %}
{% if block.data.items %}
    <div class="row g-4">
        {% for item in block.data.items %}
            {% partial block.data.card item=item %}
        {% endfor %}
    </div>
    {% if block.data.more_url %}
        <p class="mt-4 mb-0"><a class="btn btn-nlb-outline" href="{{ block.data.more_url }}">Смотреть все</a></p>
    {% endif %}
{% endif %}
