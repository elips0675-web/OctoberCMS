name: 'Универсальный шаблон'
code: elv
description: 'Универсальная тема: услуги, каталог, события, брони и заказы; контент из Tailor-записей.'
author: ELV
homepage: 'https://github.com/elips0675-web/OctoberCMS'
form:
    fields:
        meta_title:
            label: 'Заголовок для поисковиков'
            commentAbove: 'Подставляется в <title>. Пусто — берётся заголовок страницы.'
            type: text
            span: left
        meta_description:
            label: 'Описание для поисковиков'
            type: textarea
            size: small
        seo_separator:
            label: 'Разделитель в заголовке'
            commentAbove: 'Между частями шаблона: «Новости — Ваша организация».'
            type: text
            default: '—'
            span: left
        seo_default_image:
            label: 'Картинка для соцсетей'
            commentAbove: 'Полный адрес или путь от корня. Пусто — картинка темы hero-1.jpg.'
            type: text
            span: right
        seo_title_template:
            label: 'Шаблон заголовка записи'
            commentAbove: 'Переменные: {title}, {section}, {brand}, {separator}, {year}.'
            comment: 'Пусто — «{title} {separator} {brand}».'
            type: textarea
            size: small
            default: '{title} {separator} {brand}'
        seo_description_template:
            label: 'Шаблон описания записи'
            commentAbove: 'Переменные: {description}, {section}, {brand}, {year}.'
            comment: 'Пусто — описание записи как есть, обрезка по словам до 160 знаков.'
            type: textarea
            size: small
        seo_verify_google:
            label: 'Google: код подтверждения'
            commentAbove: 'Значение meta google-site-verification. Пусто — тег не выводится.'
            type: text
            span: left
        seo_verify_yandex:
            label: 'Яндекс: код подтверждения'
            commentAbove: 'Значение meta yandex-verification.'
            type: text
            span: right
        seo_verify_bing:
            label: 'Bing: код подтверждения'
            commentAbove: 'Значение meta msvalidate.01.'
            type: text
            span: left
        seo_index_service_pages:
            label: 'Индексировать служебные страницы'
            commentAbove: 'Поиск, вход и личный кабинет. По умолчанию закрыты в robots.txt.'
            type: switch
            default: false
        brand_name:
            label: 'Название организации'
            commentAbove: 'Шапка, подвал, <title>, письма и микроразметка.'
            type: text
            default: 'Ваша организация'
            span: left
        brand_tagline:
            label: 'Подпись под названием'
            type: text
            default: 'Центр услуг'
            span: right
        brand_legal_name:
            label: 'Юридическое наименование'
            commentAbove: 'Для реквизитов и микроразметки.'
            type: text
            default: 'Ваша организация'
            span: left
        brand_kind:
            label: 'Тип организации'
            commentAbove: 'Строка над заголовком на главной: «Организация · Город».'
            type: text
            default: 'Организация'
            span: right
        brand_description:
            label: 'Описание для микроразметки'
            type: textarea
            size: small
            default: 'Сайт организации: услуги, события и контакты.'
        brand_phone:
            label: 'Телефон'
            type: text
            default: '+375 (00) 000-00-00'
            span: left
        brand_email:
            label: 'E-mail'
            type: text
            default: 'info@example.com'
            span: right
        brand_postal_code:
            label: 'Индекс'
            type: text
            default: '000000'
            span: left
        brand_city:
            label: 'Город'
            type: text
            default: 'Город'
            span: right
        brand_street:
            label: 'Улица и дом'
            type: text
            default: 'ул. Примерная, 1'
        brand_country:
            label: 'Код страны'
            commentAbove: 'Двухбуквенный код для schema.org, например BY.'
            type: text
            default: 'BY'
            span: left
        brand_hours:
            label: 'Часы работы'
            type: text
            default: 'Ежедневно 10:00–22:00'
            span: right
        brand_opens:
            label: 'Открытие'
            type: text
            default: '10:00'
            span: left
        brand_closes:
            label: 'Закрытие'
            type: text
            default: '22:00'
            span: right
        brand_schema_type:
            label: 'Тип в микроразметке'
            commentAbove: 'Organization — универсально; Library, Store, LocalBusiness — если подходит.'
            type: dropdown
            default: Organization
            options:
                Organization: Organization
                LocalBusiness: LocalBusiness
                Library: Library
                Store: Store
        brand_social_telegram:
            label: 'Telegram'
            commentAbove: 'Полная ссылка, например https://t.me/your_channel. Пусто — кнопка скрыта.'
            type: text
            span: left
        brand_social_whatsapp:
            label: 'WhatsApp'
            commentAbove: 'Номер в международном формате. Пусто — кнопка скрыта.'
            type: text
            span: right
        brand_social_vk:
            label: 'ВКонтакте'
            type: text
            span: right
        brand_social_youtube:
            label: 'YouTube'
            type: text
