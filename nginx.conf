## Сжатие и кеш: то, что больше всего влияет на LCP
#
# Без этого документа 188 КБ уезжают несжатыми (Lighthouse: Performance 83),
# а статика перезапрашивается на каждом переходе. Бюджет: HTML 188 КБ → 34 КБ,
# script.js 74 КБ → 17 КБ. Заголовки `Cache-Control` для ассетов темы добавляет
# еще и middleware плагина (Nlb\Library\Classes\Http\CompressResponse) — на случай
# хостинга без nginx; здесь дублируется то, что обязан делать периметр.

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;

## Заголовки безопасности: то, что одинаково для всех ответов.
#
# Статику отдаёт nginx, и PHP-мидлвар до неё не доходит, поэтому набор
# дублируется здесь. Три заголовка приложение тоже ставит (для shared-хостинга
# и `php artisan serve`), поэтому в FastCGI-блоке они скрываются — иначе
# браузер получит два значения одного заголовка.
#
# CSP и X-Frame-Options сюда НЕ дублируются: в CSP одноразовый nonce на каждый
# ответ, а X-Frame-Options зависит от пути (фронт DENY, админка SAMEORIGIN).
# Оба ставит `Nlb\Library\Classes\Http\SecurityHeaders`.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location / {
    # Let October CMS handle everything by default.
    # The path not resolved by October CMS router will return October CMS's 404 page.
    # Everything that does not match with the allowlist below will fall into this.
    rewrite ^/.*$ /index.php last;
}

# Pass the PHP scripts to FastCGI server
location ~ ^/index.php {
    # Write your FPM configuration here

    # Приложение ставит эти же заголовки само; скрываем дубли, nginx добавит
    # свои из блока выше. CSP и X-Frame-Options остаются от PHP.
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Permissions-Policy;
}

# Allowlist
location ~ ^/(favicon\.ico|sitemap\.xml|robots\.txt|humans\.txt) { try_files $uri /index.php; }

# Block all .dotfiles except well-known
location ~ /\.(?!well-known).* { deny all; }

## Static Files
location ~ ^/storage/app/(uploads/public|media|resources) { try_files $uri 404; expires 7d; }
location ~ ^/storage/temp/public { try_files $uri 404; }
location ~ ^/modules/.*/(assets|resources) { try_files $uri 404; expires 1y; }
location ~ ^/modules/.*/(behaviors|widgets|formwidgets|reportwidgets)/.*/(assets|resources) { try_files $uri 404; expires 1y; }
location ~ ^/plugins/.*/.*/(assets|resources) { try_files $uri 404; expires 1y; }
location ~ ^/plugins/.*/.*/(behaviors|reportwidgets|formwidgets|widgets)/.*/(assets|resources) { try_files $uri 404; expires 1y; }
location ~ ^/themes/.*/(?:assets|resources) { try_files $uri 404; expires 1y; }
